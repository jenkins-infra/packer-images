---
# Replaces the install_qemu() function of provisioning/ubuntu-provision.sh.
# `qemu` was a transitional dummy on 22.04 and is gone from 24.04 onwards, and
# `qemu-user-static` is only a virtual package from 26.04, provided by `qemu-user-binfmt`.
- name: Install the qemu user emulation packages
  ansible.builtin.apt:
    name:
      - binfmt-support
      - qemu-user-binfmt
    state: present
    install_recommends: false
    update_cache: true

# Registers the binfmt handlers for every architecture qemu supports. Only useful on amd64
# hosts, and tolerated when it fails because the docker builder has no usable docker daemon.
- name: Register the qemu binfmt handlers
  ansible.builtin.command:
    cmd: docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
  when: ansible_facts['architecture'] == 'x86_64'
  changed_when: false
  failed_when: false
