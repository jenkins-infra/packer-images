---
# Replaces the install_jq() function of provisioning/ubuntu-provision.sh.
- name: Create a temporary download directory
  ansible.builtin.tempfile:
    state: directory
  register: jq_temp_download_dir

- name: Copy the jq release keyring
  ansible.builtin.copy:
    src: jq-keyring.kbx
    dest: "{{ jq_temp_download_dir.path }}/jq-keyring.kbx"
    mode: "0644"

- name: Download jq and its detached signature
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "{{ jq_temp_download_dir.path }}/{{ item.dest }}"
    mode: "0644"
  loop:
    - url: "https://github.com/jqlang/jq/releases/download/jq-{{ jq_version }}/{{ jq_binary_file }}"
      dest: "{{ jq_binary_file }}"
    - url: "https://raw.githubusercontent.com/jqlang/jq/master/sig/v{{ jq_version }}/{{ jq_binary_file }}.asc"
      dest: "{{ jq_binary_file }}.asc"

- name: Verify the jq signature
  ansible.builtin.command:
    cmd: gpgv --keyring={{ jq_temp_download_dir.path }}/jq-keyring.kbx {{ jq_binary_file }}.asc {{ jq_binary_file }}
    chdir: "{{ jq_temp_download_dir.path }}"
  changed_when: false

- name: Install jq
  ansible.builtin.copy:
    src: "{{ jq_temp_download_dir.path }}/{{ jq_binary_file }}"
    dest: /usr/local/bin/jq
    mode: a+x
    remote_src: true

- name: Remove the temporary download directory
  ansible.builtin.file:
    path: "{{ jq_temp_download_dir.path }}"
    state: absent
