---
- name: Create a temporary download directory
  ansible.builtin.tempfile:
    state: directory
  register: netlify_deploy_temp_download_dir

- name: Download and extract the netlify-golang-deploy archive
  ansible.builtin.unarchive:
    src: "https://github.com/halkeye/netlify-golang-deploy/releases/download/v{{ netlifydeploy_version }}/netlify-golang-deploy_{{ netlifydeploy_version }}_Linux_{{ netlify_deploy_architecture_names[ansible_architecture] }}.tar.gz"
    dest: "{{ netlify_deploy_temp_download_dir.path }}"
    remote_src: true

# The binary is installed under a different name than the one it ships with.
- name: Install netlify-deploy
  ansible.builtin.copy:
    src: "{{ netlify_deploy_temp_download_dir.path }}/netlify-golang-deploy"
    dest: /usr/local/bin/netlify-deploy
    mode: a+x
    remote_src: true

- name: Remove the temporary download directory
  ansible.builtin.file:
    path: "{{ netlify_deploy_temp_download_dir.path }}"
    state: absent
