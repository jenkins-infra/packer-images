---
- name: Install the Datadog APT keyring from the local GPG key
  ansible.builtin.command:
    cmd: gpg --batch --yes --dearmor -o /usr/share/keyrings/datadog-keyring.gpg /tmp/gpg-keys/datadog.gpg
    creates: /usr/share/keyrings/datadog-keyring.gpg

- name: Make the Datadog APT keyring readable by every user
  ansible.builtin.file:
    path: /usr/share/keyrings/datadog-keyring.gpg
    mode: "0644"

- name: Add the Datadog APT repository
  ansible.builtin.deb822_repository:
    name: datadog
    types: [deb]
    uris: https://apt.datadoghq.com/
    suites: [stable]
    components: ["7"]
    signed_by: /usr/share/keyrings/datadog-keyring.gpg
    # The module needs the python3-debian library and does not assume it is present.
    install_python_debian: true

- name: Install the Datadog agent
  ansible.builtin.apt:
    name:
      - datadog-agent
      - datadog-signing-keys
    state: present
    install_recommends: false
    update_cache: true

# Disabled at startup to avoid error logs before cloud-init provides the datadog parameters.
- name: Disable the Datadog agent service
  ansible.builtin.systemd_service:
    name: datadog-agent
    enabled: false
