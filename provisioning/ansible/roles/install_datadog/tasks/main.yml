---
- name: Add the Datadog APT repository
  ansible.builtin.deb822_repository:
    name: datadog
    types: [deb]
    uris: https://apt.datadoghq.com/
    suites: [stable]
    components: ["7"]
    # The repository key is committed in this repository rather than fetched over the
    # network, so it is passed as an armored block instead of a URL.
    signed_by: "{{ lookup('ansible.builtin.file', 'datadog.gpg') }}"
    # The module needs the python3-debian library and does not assume it is present.
    install_python_debian: true

- name: Install the Datadog agent
  ansible.builtin.apt:
    name:
      - datadog-agent
      - datadog-signing-keys
    state: present
    install_recommends: false
    update_cache: true

# The VM spinning up through cloud-init provides the Datadog parameters, so the agent must
# not start before them or it logs errors on every boot.
- name: Disable the Datadog agent service
  ansible.builtin.systemd_service:
    name: datadog-agent
    enabled: false
