---
name: Bump azure `ubuntu 26.04` arm64 image version

scms:
  default:
    kind: github
    spec:
      user: "{{ .github.user }}"
      email: "{{ .github.email }}"
      owner: "{{ .github.owner }}"
      repository: "{{ .github.repository }}"
      token: "{{ requiredEnv .github.token }}"
      username: "{{ .github.username }}"
      branch: "{{ .github.branch }}"

sources:
  lastReleaseVersion:
    kind: shell
    name: Get the latest `ubuntu 26.04` arm64 image version from Azure
    spec:
      command: az login --service-principal -u $AZURE_CLIENT_ID -p $AZURE_CLIENT_SECRET --tenant $AZURE_TENANT_ID > /dev/null && az vm image list --location eastus2 --publisher Canonical --offer ubuntu-26_04-lts --sku server-arm64 --all --query "[?offer=='ubuntu-26_04-lts'].version" -o tsv | sort -u | tail -n 1
      environments:
        - name: PATH
        - name: AZURE_CLIENT_ID
        - name: AZURE_CLIENT_SECRET
        - name: AZURE_TENANT_ID

targets:
  updateVersion:
    name: Update azure `ubuntu 26.04` arm64 image version in locals
    sourceid: lastReleaseVersion
    kind: yaml
    spec:
      file: ./images-versions.yaml
      key: $.azure.ubuntu.'26.04'.arm64
    scmid: default

actions:
  default:
    kind: github/pullrequest
    scmid: default
    spec:
      title: Bump Azure Ubuntu `26.04` arm64 image version
      description: "Update the latest Azure Ubuntu 26.04 arm64 image version in the images-versions.yaml file."
      labels:
        - enhancement
        - ubuntu
        - linux
        - packer-azure-arm
