---
name: Bump typos version

scms:
  default:
    kind: github
    spec:
      user: "{{ .github.user }}"
      email: "{{ .github.email }}"
      owner: "{{ .github.owner }}"
      repository: "{{ .github.repository }}"
      token: "{{ requiredEnv .github.token }}"
      username: "{{ .github.username }}"
      branch: "{{ .github.branch }}"

sources:
  lastReleaseVersion:
    kind: githubrelease
    name: Get the latest `typos` release version
    spec:
      owner: "crate-ci"
      repository: "typos"
      token: "{{ requiredEnv .github.token }}"
      username: "{{ .github.username }}"
      versionfilter:
        kind: semver
    transformers:
      - trimprefix: v

targets:
  updateVersion:
    name: "Update the `typos` version in the tools-versions.yml file"
    sourceid: lastReleaseVersion
    kind: yaml
    spec:
      file: "provisioning/tools-versions.yml"
      key: "$.typos_version"
    scmid: default
  updateTyposVersionInGoss:
    name: Update the `typos` version in the goss test
    kind: yaml
    spec:
      files:
        - tests/goss-linux.yaml
      key: $.command.typos.stdout[0]
    scmid: default

actions:
  default:
    kind: github/pullrequest
    title: Bump typos version to {{ source "lastReleaseVersion" }}
    scmid: default
    spec:
      labels:
        - enhancement
        - typos
        - linux
