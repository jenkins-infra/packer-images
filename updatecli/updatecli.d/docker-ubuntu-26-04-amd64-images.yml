---
name: Bump docker `ubuntu 26_04 amd64` image version

scms:
  default:
    kind: github
    spec:
      user: "{{ .github.user }}"
      email: "{{ .github.email }}"
      owner: "{{ .github.owner }}"
      repository: "{{ .github.repository }}"
      token: "{{ requiredEnv .github.token }}"
      username: "{{ .github.username }}"
      branch: "{{ .github.branch }}"

sources:
  lastDockerDigest:
    kind: dockerdigest
    spec:
      image: "ubuntu"
      tag: "26.04"
      architecture: "amd64"

targets:
  updateDigest:
    name: Update docker `ubuntu 26_04 amd64` image version in locals
    sourceid: lastDockerDigest
    kind: yaml
    scmid: default
    spec:
      file: ./images-versions.yaml
      key: $.docker.ubuntu.'26.04'.amd64
    transformers:
      - trimprefix: '26.04@'

actions:
  default:
    kind: github/pullrequest
    scmid: default
    spec:
      title: Bump docker `ubuntu 26_04 amd64` image version
      description: "Follow up docker images for ubuntu 26_04 amd64"
      labels:
        - enhancement
        - ubuntu
        - linux
        - packer-docker
