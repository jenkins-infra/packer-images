---
name: Bump Ansible Core version

scms:
  default:
    kind: github
    spec:
      user: "{{ .github.user }}"
      email: "{{ .github.email }}"
      owner: "{{ .github.owner }}"
      repository: "{{ .github.repository }}"
      token: "{{ requiredEnv .github.token }}"
      username: "{{ .github.username }}"
      branch: "{{ .github.branch }}"

sources:
  lastReleaseVersion:
    name: Get latest Ansible Core version from PyPI
    kind: pypi
    spec:
      name: ansible-core

targets:
  updateVersion:
    name: Update Ansible Core version in the tools-versions.yml file
    sourceid: lastReleaseVersion
    kind: yaml
    spec:
      file: "provisioning/tools-versions.yml"
      key: "$.ansible_core_version"
    scmid: default
  updatePackerVersionInGoss:
    name: Update Ansible Core version in goss tests
    kind: yaml
    transformers:
      - addprefix: 'core '
    spec:
      files:
        - tests/goss-linux.yaml
      key: $.command.ansible.stdout[0]
    scmid: default

actions:
  default:
    kind: github/pullrequest
    title: 'feat(linux): Bump Ansible Core version to `{{ source "lastReleaseVersion" }}`'
    scmid: default
    spec:
      labels:
        - enhancement
        - ansible-core
        - linux
