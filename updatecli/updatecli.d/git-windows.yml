---
name: Bump Git version on Windows

scms:
  default:
    kind: github
    spec:
      user: "{{ .github.user }}"
      email: "{{ .github.email }}"
      owner: "{{ .github.owner }}"
      repository: "{{ .github.repository }}"
      token: "{{ requiredEnv .github.token }}"
      username: "{{ .github.username }}"
      branch: "{{ .github.branch }}"

sources:
  lastReleaseVersion:
    kind: githubrelease
    name: Get the latest Git version
    spec:
      owner: "git-for-windows"
      repository: "git"
      token: "{{ requiredEnv .github.token }}"
      username: "{{ .github.username }}"
      versionfilter:
        kind: regex
        ## Latest stable v{x.y.z}.windows.<patch>
        pattern: 'v(\d*)\.(\d*)\.(\d*)\.windows\.(\d*)$'
    transformers:
      - trimprefix: "v"

targets:
  updateGitVersion:
    name: Update the Git Windows version in the Packer default values
    kind: yaml
    transformers:
      - findsubmatch:
          pattern: '(.*).windows\.(\d*)$'
          captureindex: 1
    spec:
      file: "provisioning/tools-versions.yml"
      key: "git_windows_version"
    scmid: default
  updateGitPatchVersion:
    name: Update the Git Package Windows patch in the Packer default values
    kind: yaml
    transformers:
      - findsubmatch:
          pattern: '(.*).windows\.(\d*)$'
          captureindex: 2
    spec:
      file: "provisioning/tools-versions.yml"
      key: "git_windows_patch_version"
    scmid: default

actions:
  default:
    kind: github/pullrequest
    title: Bump Git version on Windows to {{ source "lastReleaseVersion" }}
    scmid: default
    spec:
      labels:
        - enhancement
        - git
        - windows
